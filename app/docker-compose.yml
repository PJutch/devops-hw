services:
  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - backend
    depends_on:
      - app
  app:
    image: nginx:latest
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html
    networks:
      - backend
networks:
  backend:

